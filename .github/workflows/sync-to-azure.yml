name: Sync to Azure

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: sync-azure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push branch to Azure
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          SOURCE_REF: ${{ github.ref }}
        run: bash scripts/sync-branch.sh to-azure
