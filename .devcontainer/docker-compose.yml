services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:24
    volumes:
      - ..:/workspaces/vakar:cached
    command: sleep infinity
    env_file: ../Vakar/.env
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    env_file: ../Vakar/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

volumes:
  pgdata: