trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Install Node.js'

  - script: |
      npm ci
      npm run build
    workingDirectory: '$(Build.SourcesDirectory)/Vakar'
    displayName: 'Build frontend'

  - task: AzureStaticWebApp@0
    inputs:
      app_location: 'Vakar/dist'
      output_location: ''
      api_location: ''
      skip_app_build: true
      skip_api_build: true
      azure_static_web_apps_api_token: '$(deployment_token)'
    displayName: 'Deploy frontend'